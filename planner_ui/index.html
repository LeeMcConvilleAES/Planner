<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AES Transport Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap">
<style>
@keyframes awayPulse{0%,100%{box-shadow:inset 0 0 0 0 rgba(232,122,0,0)}50%{box-shadow:inset 0 0 0 4px rgba(232,122,0,.9)}}
@keyframes noPoPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,48,30,0)}50%{box-shadow:0 0 0 3px rgba(224,48,30,.85)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
:root{color-scheme:light}
html,body{background:#f3f2f2}
body{margin:0;color:#201e1d;font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid #0d823b;outline-offset:1px}
.scroll{overflow-x:auto}
.app{min-width:1240px;background:#f3f2f2}
.band{display:flex;align-items:stretch;border-bottom:2px solid #201e1d;background:#fff}
.logo{display:flex;align-items:center;padding:10px 22px;border-right:2px solid #201e1d}
.logo img{height:44px;width:auto;display:block}
.title{display:flex;align-items:center;gap:12px;padding:12px 20px;flex:1}
.title b{font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.ver{font-size:10px;font-weight:800;letter-spacing:.1em;padding:2px 6px;border:1px solid #201e1d}
.hcell{padding:0 18px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;white-space:nowrap;border-left:1px solid #bab6b6}
.sq{width:8px;height:8px;display:inline-block}
.bc{color:#605d5d}
.bc .sq{background:#9b9797}
.sync{color:#0a6a30}
.sync .sq{background:#0d823b}
.mode{padding:0 18px;display:flex;align-items:center;font-size:12px;font-weight:800;letter-spacing:.08em;white-space:nowrap;color:#605d5d;background:#fff}
.mode.on-team{background:#0d823b;color:#fff}
.mode.md{background:#201e1d;color:#fff;border-left:2px solid #201e1d;letter-spacing:.14em}
.mode.md:hover{background:#0d823b}
.panel.md{max-width:1100px;min-width:900px;margin-top:40px}
.panel.md .eyebrow{color:#201e1d}
.panel.md .cell select{font:600 13px 'Figtree',sans-serif;border:1px solid #201e1d;background:#fff;padding:6px 10px;border-radius:0;color:#201e1d}
.metrics.md4{grid-template-columns:repeat(4,minmax(0,1fr))}
.metric .sub{font-size:11px;color:#9b9797;margin-top:2px}
.mdbody{padding:16px 20px 20px}
.mdt{width:100%;border-collapse:collapse}
.mdt th{font-size:10px;font-weight:800;letter-spacing:.1em;color:#605d5d;text-align:left;padding:6px 8px;border-bottom:2px solid #201e1d}
.mdt td{padding:7px 8px;border-bottom:1px solid #bab6b6;font-size:13px;vertical-align:middle}
.mdt .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mdt .bar{width:30%}.mdt .bar i{display:block;height:10px;background:#0d823b}
.mdnote{margin-top:14px;font-size:11px;color:#605d5d;line-height:1.5}
.metrics.money{border-top:0;background:#f7f6f6;grid-template-columns:repeat(5,minmax(0,1fr))}
.metrics.money .metric .v{font-size:28px}
.mdt .neg,.metric .neg{color:#c0261a;font-weight:800}.mdt .pos,.metric .pos{color:#0a6a30;font-weight:800}
.panel.md{max-width:1320px;min-width:1080px}
.panel.mdpin{max-width:420px;min-width:360px}
.pinbody{padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.pinbody input{font:800 26px 'Figtree',sans-serif;letter-spacing:.4em;text-align:center;padding:10px;border:2px solid #201e1d;border-radius:0;outline:0}
.pinbody .tbtn{justify-content:center;padding:12px;border:0}
.pinerr{color:#c0261a;font-weight:800;font-size:13px}
.pinhint{color:#605d5d;font-size:12px;line-height:1.5}
.done.lockbtn{background:#605d5d}.done.lockbtn:hover{background:#c0261a}
.mode.on-ro{background:#201e1d;color:#fff}
.modes{display:flex;border-left:2px solid #201e1d}
.tbtn{padding:10px 18px;font-size:13px;font-weight:800;display:flex;align-items:center}
.tbtn:hover{background:#eae7e7}
.tbtn.primary{background:#0d823b;color:#fff;min-width:180px}
.tbtn.primary:hover{background:#0a6a30}
.hint{padding:10px 18px;font-size:12px;color:#605d5d;display:flex;align-items:center;flex:1;border-left:1px solid #bab6b6}
.nav{width:48px;display:flex;align-items:center;justify-content:center;border-right:1px solid #bab6b6;font-size:18px}
.nav:hover{background:#eae7e7}
.wk{flex:1;padding:10px 14px;border-right:1px solid #bab6b6}
.wkjump{min-width:210px;font:700 13px 'Figtree',sans-serif;border:0;border-left:1px solid #bab6b6;background:#fff;padding:0 12px;color:#201e1d;cursor:pointer}
.wk:hover{background:#eae7e7}
.wk.on{background:#0d823b;color:#fff}
.wk b{display:block;font-weight:800;font-size:13px}
.wk span{font-size:11px;opacity:.85}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,2.2fr);border-bottom:2px solid #201e1d}
.metric{padding:14px 18px;border-right:1px solid #bab6b6}
.metric .l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#605d5d}
.metric .v{font-size:36px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.metric.alert .v{color:#c0261a}
.tools{padding:14px 18px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.search{display:flex;border:1px solid #201e1d;background:#fff}
.search input{flex:1;min-width:0;padding:8px 10px;font:13px 'Figtree',sans-serif;border:0;outline:0;background:transparent;color:#201e1d}
.search select{padding:8px 12px;border:0;border-left:1px solid #201e1d;font:600 13px 'Figtree',sans-serif;background:#fff;color:#201e1d;border-radius:0}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;font-weight:600;white-space:nowrap}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;display:inline-block}
.notice{display:flex;gap:14px;align-items:center;padding:9px 18px;background:#fff4e8;border-bottom:2px solid #201e1d;font-size:13px;font-weight:600;color:#6b4a00}
.notice b{font-weight:800;color:#201e1d}
.notice .pill{background:#d9730d;color:#fff;font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 7px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.day{border-right:2px solid #201e1d;display:flex;flex-direction:column}
.day:last-child{border-right:0}
.day.today{background:#fff}
.dh{display:block;width:100%;padding:10px 12px;border-bottom:2px solid #201e1d;border-top:6px solid #0d823b;background:#fff}
.dh:hover{box-shadow:inset 0 0 0 2px #201e1d}
.dh.cap{background:#c0261a;color:#fff;border-top-color:#c0261a}
.dh.wkend{border-top-color:#7d7979}
.dh .r1{display:flex;justify-content:space-between;align-items:baseline}
.dh .r1 b{font-weight:800;font-size:16px;white-space:nowrap}
.dh .r1 span{font-size:12px;font-weight:600;white-space:nowrap}
.dh .r2{display:flex;justify-content:space-between;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;margin-top:2px;height:15px;line-height:15px;white-space:nowrap}
.flag-today{color:#0a6a30}
.plan-red{color:#c0261a}
.plan-grey{color:#605d5d}
.dh.cap .r2 span{color:#fff}
.capbtn{display:block;width:100%;padding:5px 12px;border-bottom:1px solid #bab6b6;font-size:11px;font-weight:800;background:#fff;color:#605d5d}
.capbtn.on{background:#fde3de;color:#9c1f14}
.strip{display:block;width:100%;padding:5px 12px;border-bottom:1px solid #bab6b6;font-size:11px;font-weight:600;height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9b9797}
.strip.has{background:#fff4d6;color:#6b4a00}
.strip:hover{box-shadow:inset 0 0 0 2px #d9730d}
.strip b{font-weight:800}
.subs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #bab6b6}
.sub{padding:5px 8px;font-size:10px;font-weight:800;letter-spacing:.1em;display:flex;justify-content:space-between;gap:4px}
.sub.d{border-bottom:3px solid #0d823b;color:#0a6a30}
.sub.c{border-bottom:3px solid #c0261a;border-left:1px solid #bab6b6;color:#9c1f14}
.lanes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);flex:1}
.lane{padding:6px;display:flex;flex-direction:column;gap:6px}
.lane+.lane{border-left:1px solid #bab6b6}
.empty{font-size:11px;color:#9b9797;padding:6px 2px}
.card{border:1px solid;padding:6px 7px;display:flex;flex-direction:column;gap:2px}
.card:hover{border-color:#201e1d}
.k-bd{background:#dcf2e3;border-color:#0d823b}
.k-bc{background:#fde3de;border-color:#c0261a}
.k-e{background:#fff;border:1px dashed #605d5d}
.k-mv{background:#ece9fb;border-color:#5a4fcf}
.k-fuel{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 15% 0%,#514d4b 0%,#201e1d 45%,#000 100%);border-color:#000;color:#f2efee;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -8px 14px rgba(0,0,0,.65),0 1px 2px rgba(0,0,0,.35)}
.k-fuel::before{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(65% 45% at 85% 15%,rgba(130,80,210,.5) 0%,rgba(130,80,210,0) 70%),radial-gradient(60% 40% at 20% 75%,rgba(20,160,150,.45) 0%,rgba(20,160,150,0) 70%),radial-gradient(50% 35% at 70% 90%,rgba(220,130,40,.42) 0%,rgba(220,130,40,0) 70%),radial-gradient(45% 30% at 40% 45%,rgba(40,120,230,.38) 0%,rgba(40,120,230,0) 70%)}
.k-fuel::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 28%,rgba(255,255,255,.28) 42%,rgba(255,255,255,.05) 50%,rgba(255,255,255,0) 58%),radial-gradient(70% 30% at 50% 0%,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 70%)}
.k-fuel>*{position:relative;z-index:2}
.rc.k-fuel .meta,.lc.k-fuel .meta,.rc.k-fuel .lbl2,.lc.k-fuel .lbl2{color:#e4e0de}
.rc.k-fuel .notes,.lc.k-fuel .notes{color:#bdb8b5}
.k-fuel .cust{color:#fff}
.k-fuel .post,.k-fuel .meta,.k-fuel .lbl2,.k-fuel .notes,.k-fuel .u,.k-fuel .ref,.k-fuel .po,.k-fuel small,.k-fuel span{color:#e4e0de}
.k-fuel .notes{color:#bdb8b5}
.k-fuel .tag{position:relative}
.t-fuel{background:#f2b705;color:#1c1a19}
.k-fuel.is-done{opacity:.55}
.k-mv .cust{color:#2e2780}
.card.is-done,.lc.is-done,.rc.is-done{opacity:.5}
.t-move{background:#5a4fcf;color:#fff}
.t-done{background:#605d5d;color:#fff}
.t-live{background:#d9730d;color:#fff}
.t-conv{background:#6f2dbd;color:#fff}
.code.moved{background:#d9730d;color:#fff;padding:0 3px}
.dropped{padding:5px 12px;border-bottom:1px solid #bab6b6;background:#fde3de;color:#5e120b;font-size:11px;font-weight:600}
.dropped .x{font-size:13px;vertical-align:middle}
.mode{cursor:pointer}
.pwcell input{border:1px solid #201e1d;padding:6px 8px;font:13px 'Figtree',sans-serif;border-radius:0;background:#fff;color:#201e1d;width:170px;margin-right:6px}
.card{cursor:pointer}
.panel.view{max-width:760px;min-width:640px;margin-top:40px}
.vrows>div{overflow-wrap:anywhere}
.vrows{padding:14px 20px 18px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;font-size:13px}
.vrows .k{font-size:10px;font-weight:800;letter-spacing:.1em;color:#605d5d;padding-top:2px}
.vrows table{border-collapse:collapse;width:100%}
.vrows td,.vrows th{text-align:left;font-size:12px;padding:4px 6px;border-bottom:1px solid #bab6b6}
.vrows th{font-size:10px;font-weight:800;letter-spacing:.08em;color:#605d5d}
.notice .coll{margin-left:6px;padding:2px 8px;font-size:11px;background:#fff}
html,body{height:100%;overflow:auto}
.k-bd .cust{color:#063d1c}
.k-bc .cust{color:#5e120b}
.nopo{animation:noPoPulse 1.4s ease-in-out infinite}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:9px;font-weight:800;letter-spacing:.08em;padding:1px 4px;white-space:nowrap}
.t-del{background:#0d823b;color:#fff}
.t-col{background:#c0261a;color:#fff}
.t-enq{background:#ffe08a;color:#5a3d00}
.t-slot{background:#fff;color:#201e1d;box-shadow:inset 0 0 0 1px #201e1d}
.t-nopo{background:#c0261a;color:#fff}
.t-warn{background:#d9730d;color:#fff}
.cust{font-weight:800;font-size:12px;line-height:1.2;overflow-wrap:anywhere}
.ld{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;font-size:11px;line-height:1.3}
.ld>span:first-child{min-width:0;flex:1;overflow-wrap:break-word}
.code{font-weight:800}
.code.plan{font-size:9px;letter-spacing:.08em;color:#c0261a;padding-top:1px}
.code.legacy{font-size:10px;background:#d9730d;color:#fff;padding:0 3px}
.post{font-size:11px;font-weight:600;color:#444141;overflow-wrap:anywhere}
.mi{display:inline-block;background:#e8e6e6;color:#201e1d;border-radius:3px;padding:0 5px;font-size:10px;font-weight:800;margin-left:4px;white-space:nowrap}
.vrows .mi{font-size:12px;font-weight:700;padding:1px 7px}
.ref{font-size:10px;font-weight:800;letter-spacing:.04em;color:#444141;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.notes{font-size:10px;color:#605d5d;font-style:italic}
.notes-1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-size:10px;font-weight:800}
.ov{position:fixed;inset:0;z-index:50;background:rgba(32,30,29,.6);display:flex;justify-content:safe center;align-items:flex-start;padding:24px;overflow:auto}
.panel{width:100%;max-width:1760px;min-width:1320px;flex:none;background:#fff;border:2px solid #201e1d;display:flex;flex-direction:column}
.rp{height:calc(100vh - 48px);height:calc(100dvh - 48px);min-height:620px}
.ph{display:flex;align-items:stretch;border-bottom:2px solid #201e1d;flex:none}
.ph .t{padding:14px 20px;flex:1;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;color:#0a6a30}
.ph h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.ph .cell{padding:0 20px;display:flex;align-items:center;font-size:13px;font-weight:600;color:#605d5d;border-left:1px solid #bab6b6;white-space:nowrap}
.push{padding:0 20px;display:flex;flex-direction:column;justify-content:center;border-left:1px solid #bab6b6;font-size:12px;font-weight:800;color:#9b9797;cursor:not-allowed;white-space:nowrap}
.push small{font-size:11px;font-weight:600}
.done{padding:0 28px;display:flex;align-items:center;background:#201e1d;color:#fff;font-size:13px;font-weight:800;letter-spacing:.08em}
.done:hover{background:#0d823b}
.warn{padding:10px 20px;background:#c0261a;color:#fff;font-size:13px;font-weight:700;border-bottom:2px solid #201e1d;flex:none}
.viewonly{padding:9px 20px;background:#201e1d;color:#fff;font-size:12px;font-weight:700;letter-spacing:.02em;border-bottom:2px solid #201e1d;flex:none}
.pool{padding:12px 20px 14px;border-bottom:2px solid #201e1d;display:flex;flex-direction:column;gap:8px;flex:none}
.poolhd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.poolhd .lbl{font-size:13px;font-weight:800;letter-spacing:.1em;white-space:nowrap}
.cnt{font-size:13px;font-weight:800;padding:1px 7px;background:#201e1d;color:#fff}
.poolhd .h{font-size:12px;color:#605d5d;flex:1}
.seg{display:flex;border:1px solid #201e1d}
.seg button{padding:4px 10px;font-size:11px;font-weight:800;letter-spacing:.06em}
.seg button+button{border-left:1px solid #201e1d}
.seg button.on{background:#201e1d;color:#fff}
.coll{font-size:12px;font-weight:800;padding:4px 10px;border:1px solid #201e1d}
.coll:hover{background:#eae7e7}
.poolbody{max-height:28vh;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:8px;background:#f3f2f2;border:1px dashed #9b9797;min-height:64px}
.poolbody.over{background:#eef8f1;border-color:#0d823b}
.allgood{font-size:13px;font-weight:600;color:#0a6a30;padding:18px 8px}
.lc{width:224px;display:flex;flex-direction:column;gap:2px;border:1px solid;padding:6px 8px}
.lc[draggable="true"]{cursor:grab}
.lc.dragging{opacity:.35}
.lc .cust{font-size:13px}
.lc .lbl2{font-size:12px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.lc .meta{font-size:11px;font-weight:600;color:#444141}
.lc.legacyc{box-shadow:inset 0 0 0 2px #d9730d}
.lc.enqrun{box-shadow:inset 0 0 0 2px #d9730d}
.flagline{font-size:10px;font-weight:800;letter-spacing:.06em;color:#9a4f00}
.mini{align-self:flex-start;margin-top:3px;font-size:11px;font-weight:800;padding:3px 8px;background:#0d823b;color:#fff}
.mini:hover{background:#0a6a30}
.drivers{flex:1;min-height:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr))}
.dcol{border-right:1px solid #bab6b6;display:flex;flex-direction:column;min-height:0;background:#fff}
.dcol:last-child{border-right:0}
.dcol.away{background:#fff4e8;animation:awayPulse 1.6s ease-in-out infinite}
.dhd{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:8px;padding:10px 8px;border-bottom:2px solid #201e1d;flex:none;height:78px}
.av-sub{background:#201e1d;color:#fff;font-size:10px;letter-spacing:0;padding:0}
.dcol.subcol{background:#f7f6f6}
.av{width:36px;height:36px;background:#eae7e7;border:2px solid #201e1d;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex:none}
.dhd .n{display:flex;flex-direction:column;min-width:0;gap:1px}
.dhd .n b{font-size:14px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhd .n span{font-size:11px;font-weight:600;color:#605d5d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate{font-size:10px;font-weight:800;letter-spacing:.02em;padding:1px 5px;background:#ffd400;border:1px solid #201e1d;color:#201e1d;white-space:nowrap}
.vrow{display:flex;gap:6px;align-items:center;margin-top:2px;white-space:nowrap;overflow:hidden}
.vrow small{font-size:11px;color:#605d5d;font-weight:600}
.awayb{padding:8px 12px;background:#d9730d;color:#fff;display:flex;flex-direction:column;gap:1px;flex:none}
.awayb b{font-size:11px;font-weight:800;letter-spacing:.1em}
.awayb span{font-size:12px;font-weight:600}
.runs{padding:10px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;min-height:0}
.run{border:1px solid #201e1d;display:flex;flex-direction:column;flex:none}

.runhd .rl{font-size:11px;font-weight:800;letter-spacing:.1em;white-space:nowrap}
.runhd select{font:700 11px 'Figtree',sans-serif;border:1px solid #201e1d;border-radius:0;background:#fff;padding:1px 2px;color:#201e1d}
.runhd .st{font-size:11px;font-weight:700;color:#605d5d}
.rmi{padding:3px 8px;font-size:10px;font-weight:800;letter-spacing:.06em;color:#201e1d;background:#e8e6e6;border-bottom:1px solid #d5d2d2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhd .n .dmi{display:block;font-size:11px;font-weight:800;color:#201e1d;margin-top:1px}
.rcode{font-size:12px;font-weight:800;padding:1px 6px;background:#0d823b;color:#fff}

  else if (id === 'ecu' || id === 'ep' || id === 'ei' || id === 'en') {
    S.enqDraft[{ecu:'customer', ep:'postcode', ei:'items', en:'notes'}[id]] = val;
    var go = document.querySelector('[data-act=addEnq]'); if (go) go.disabled = !(S.enqDraft.customer.trim() && S.enqDraft.items.trim());
    if (id === 'ei') { var em = e.target.nextElementSibling, n = val.trim() ? val.trim().split(/\n+/).length : 0; if (em) em.textContent = n ? n + ' load' + (n > 1 ? 's' : '') : 'Each line is one load on the wagon'; }
  }
  else if (id === 'vr') { var up = val.toUpperCase(); S.vehDraft.reg = up; var k = VEHICLES.filter(function(x){ return x.reg === up.trim(); })[0]; if (k) S.vehDraft.drv = k.driver; render(); }
});
document.addEventListener('change', function(e){
  var id = e.target.id, val = e.target.value;
  if (id === 'flt') S.filter = val;
  else if (id === 'hk') S.holDraft.kind = val;
  else if (id === 'lbfrom' || id === 'lbto') { if (saneDate(val)) { S[id === 'lbfrom' ? 'lbFrom' : 'lbTo'] = val; } else return; }
  else if (id === 'wkjump') S.week = +val;
  else if (id === 'hd') S.holDraft.drv = val;
  else if (id === 'ec') S.enqDraft.col = val;
  else if (id === 'ed') { if (saneDate(val)) { S.enqDraft.date = val; var em = e.target.nextElementSibling; if (em) em.textContent = fFull(val); var go = document.querySelector('[data-act=addEnq]'); if (go) go.textContent = '+ Add enquiry to ' + fFull(val); } return; }
  else if (id === 'hf' || id === 'ht') { if (saneDate(val)) { setRange(S.holDraft, id === 'hf' ? 'from' : 'to', val); syncDates('h', S.holDraft); } return; }
  else if (id === 'vt') S.vehDraft.type = val;
  else if (id === 'vd') S.vehDraft.drv = val;
  else if (id === 'vf' || id === 'vto') { if (saneDate(val)) { setRange(S.vehDraft, id === 'vf' ? 'from' : 'to', val); syncDates('v', S.vehDraft); } return; }
  else if (e.target.hasAttribute('data-start')) { S.runStart[e.target.getAttribute('data-start')] = val; render(); commit('run start time'); return; }
  else if (e.target.hasAttribute('data-set-drv') || e.target.hasAttribute('data-set-run')) { setRunFromCard(e.target); return; }
  else return;
  render();
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target && e.target.id === 'pwin') { var b = document.querySelector('[data-act=unlockGo]'); if (b) b.click(); return; }
  if (e.key === 'Enter' && e.target && e.target.id === 'mdpin') { var b2 = document.querySelector('[data-act=mdPinGo]'); if (b2) b2.click(); return; }
  if (e.key === 'Escape') { if (S.mdOpen) S.mdOpen = false; else if (S.viewJob) S.viewJob = null; else if (S.enqOpen) S.enqOpen = false; else if (S.vhOpen) S.vhOpen = false; else if (S.modalDay != null) { S.modalDay = null; S.warn = ''; } else return; render(); } });

/* drag and drop, Team Edit only */
function clearOver(){ document.querySelectorAll('.over').forEach(function(el){ el.classList.remove('over'); }); }
document.addEventListener('dragstart', function(e){
  var k = e.target.closest && e.target.closest('[data-card][draggable="true"]');
  if (k) { S.dragCard = k.getAttribute('data-card'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', S.dragCard); } catch (x) {} setTimeout(function(){ k.classList.add('dragging'); }, 0); return; }
  var c = e.target.closest && e.target.closest('[data-load][draggable="true"]'); if (!c) return;
  S.dragId = c.getAttribute('data-load'); e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', S.dragId); } catch (x) {}
  setTimeout(function(){ c.classList.add('dragging'); }, 0);
});
document.addEventListener('dragend', function(){ S.dragId = null; S.dragCard = null; clearOver(); document.querySelectorAll('.ins-above,.ins-below').forEach(function(el){ el.classList.remove('ins-above','ins-below'); }); document.querySelectorAll('.dragging').forEach(function(el){ el.classList.remove('dragging'); }); });
function insertPoint(rbody, y, dragId){
  /* the card the dragged load will go in front of, judged by card midpoints, so a
     drop anywhere in the run (on a card, in a gap, below the last card) lands where
     the pointer is; null means the end of the run */
  var cards = Array.prototype.slice.call(rbody.querySelectorAll('[data-load]')).filter(function(c){ return c.getAttribute('data-load') !== dragId; });
  for (var i = 0; i < cards.length; i++) { var r = cards[i].getBoundingClientRect(); if (y < r.top + r.height / 2) return cards[i]; }
  return null;
}
function cardInsertPoint(lane, y, dragId){
  var cards = Array.prototype.slice.call(lane.querySelectorAll('[data-card]')).filter(function(c){ return c.getAttribute('data-card') !== dragId; });
  for (var i = 0; i < cards.length; i++) { var r = cards[i].getBoundingClientRect(); if (y < r.top + r.height / 2) return cards[i]; }
  return null;
}
document.addEventListener('dragover', function(e){
  if (S.dragCard) {
    var ln = e.target.closest && e.target.closest('[data-lane]'); if (!ln || !ln.querySelector('[data-card="' + S.dragCard + '"]')) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.ins-above,.ins-below').forEach(function(el){ el.classList.remove('ins-above','ins-below'); });
    var at = cardInsertPoint(ln, e.clientY, S.dragCard), all = ln.querySelectorAll('[data-card]');
    if (at) at.classList.add('ins-above'); else if (all.length) all[all.length - 1].classList.add('ins-below');
    return;
  }
  if (!S.dragId) return; var z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  var zone = z.getAttribute('data-drop') === 'card' ? z.closest('.rbody') : z;
  if (!zone.classList.contains('over')) { clearOver(); zone.classList.add('over'); }
  document.querySelectorAll('.ins-above,.ins-below').forEach(function(el){ el.classList.remove('ins-above','ins-below'); });
  if (zone.classList.contains('rbody')) {
    var at = insertPoint(zone, e.clientY, S.dragId), all = zone.querySelectorAll('[data-load]');
    if (at) at.classList.add('ins-above'); else if (all.length) all[all.length - 1].classList.add('ins-below');
  }
});
document.addEventListener('drop', function(e){
  if (S.dragCard) {
    var ln = e.target.closest && e.target.closest('[data-lane]'); var cid = S.dragCard; S.dragCard = null; if (!ln) return;
    e.preventDefault(); var at = cardInsertPoint(ln, e.clientY, cid);
    if (reorderCard(cid, ln.getAttribute('data-lane'), at ? at.getAttribute('data-card') : null)) { render(); commit('reordered cards'); }
    return;
  }
  if (!S.dragId) return; var z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return;
  e.preventDefault(); var id = S.dragId; S.dragId = null; var kindZ = z.getAttribute('data-drop');
  if (kindZ === 'pool') move(id, null);
  else if (kindZ === 'run' || kindZ === 'card') {
    var body = kindZ === 'run' ? z : z.closest('.rbody');
    var at = insertPoint(body, e.clientY, id), before = at ? at.getAttribute('data-load') : null;
    move(id, { drv:body.getAttribute('data-drv'), run:+body.getAttribute('data-run'), before:before, append: !before });
  }
  render();
  if (!S.warn) commit('moved load');
});

window.addEventListener('message', function(ev){
  var d = ev.data || {}; if (d.type !== 'streamlit:render') return;
  var args = d.args || {};
  var applied = build(args);
  render(); setHeight();
  if (applied) commit('converted enquiry');
  /* V4.3: the first time Mission Control is unlocked in Team Edit, and whenever the feed has moved on, save today's history */
  else if (args.can_edit && args.md_unlocked && S.mdOpen && historyChanged()) commit('mission control history');
});
post({ type:'streamlit:componentReady', apiVersion:1 });
setHeight();
})();
</script>
